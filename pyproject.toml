[project]
name = "neovis"
version = "0.1.0"
description = "Neovis — a JARVIS-style workstation agent you command from Slack or your desktop, with enterprise-grade risk gating and audit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[anthropic,openai]>=0.0.49",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "mss>=9.0",
    "pillow>=10.0",
    "claude-agent-sdk>=0.2.110",
]

[project.optional-dependencies]
slack = ["slack-bolt>=1.18", "aiohttp>=3.9"]
voice = ["openai>=1.30", "edge-tts>=6.1"]
gui = ["pyautogui>=0.9.54"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "anyio>=4.0"]

[project.scripts]
neovis = "neovis.repl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neovis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
